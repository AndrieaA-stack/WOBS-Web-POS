services:
  - type: web
    name: wobs-web-pos
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wobs-postgres
          property: connectionString

databases:
  - name: wobs-postgres
    plan: free
    databaseName: wobs_db
    user: wobs_user
