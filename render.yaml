services:
  # Node.js Express Backend Service
  - type: web
    name: wobs-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: wobs-db
          property: connectionString

# PostgreSQL Managed Database
databases:
  - name: wobs-db
    region: singapore
    plan: free
    databaseName: wobs_db
    user: postgres